name: gold-weather

on:
  schedule:
    # 22:00 UTC = 日本時間 翌朝7:00（月〜土に配信。日曜朝は市場休みのため無し）
    - cron: "0 22 * * 0-5"
    # 10:15 UTC = 日本時間 19:15（月〜金）: NY注意報。Actionsの遅延(最大50分)込みでもNY開始前に届くよう前倒し
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / morning / evening"
        required: false
        default: "auto"

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet openpyxl
      - name: Build and post gold weather report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          MODE="${MODE_INPUT:-auto}"
          if [ "$MODE" = "auto" ]; then
            H=$(date -u +%H)
            if [ "$H" -ge 9 ] && [ "$H" -le 15 ]; then MODE=evening; else MODE=morning; fi
          fi
          ARGS=""
          [ "$MODE" = "evening" ] && ARGS="--evening"
          echo "mode: $MODE"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            python -m weather $ARGS --post
          else
            echo "DISCORD_WEBHOOK_URL 未設定のため表示のみ:"
            python -m weather $ARGS
          fi
