name: verify

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "取得開始日 (YYYY-MM-DD)"
        required: false
        default: "2018-01-01"
  schedule:
    # 毎月第1土曜 03:00 UTC に再計算（最新データ込みで統計を更新）
    - cron: "0 3 1-7 * 6"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore price data cache
        uses: actions/cache@v4
        with:
          path: data/dl
          key: xauusd-m1-${{ github.run_id }}
          restore-keys: |
            xauusd-m1-
      - name: Download XAUUSD 1m history (dukascopy, 年別・低速)
        run: |
          FROM="${{ inputs.from_date }}"
          FROM="${FROM:-2018-01-01}"
          Y0=${FROM:0:4}
          Y1=$(date -u +%Y)
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p data/dl
          for Y in $(seq "$Y0" "$Y1"); do
            S="$Y-01-01"; E="$Y-12-31"
            [ "$Y" = "$Y0" ] && S="$FROM"
            [ "$Y" = "$Y1" ] && E="$TODAY"
            if [ -f "data/dl/.done-$Y" ] && [ "$Y" != "$Y1" ]; then
              echo "=== $Y cached, skip"; continue
            fi
            echo "=== $S .. $E"
            mkdir -p data/tmp && rm -f data/tmp/*.csv
            if npx --yes dukascopy-node -i xauusd -from "$S" -to "$E" \
              -t m1 -f csv -dir "data/tmp" -r 10 -rp 5000 -bs 3; then
              NEWF=$(ls data/tmp/*.csv 2>/dev/null | head -1)
              OLDF=$(ls data/dl/xauusd-m1-*"$Y"*.csv 2>/dev/null | head -1)
              NEWN=$(wc -l < "$NEWF" 2>/dev/null || echo 0)
              OLDN=$(wc -l < "$OLDF" 2>/dev/null || echo 0)
              # 既存より小さいファイルで上書きしない(部分失敗による黙った劣化を防止)
              if [ "$NEWN" -gt "$OLDN" ]; then
                [ -n "$OLDF" ] && rm -f "$OLDF"
                mv "$NEWF" data/dl/
                echo "updated $Y: $OLDN -> $NEWN lines"
              else
                echo "kept existing $Y: new=$NEWN <= old=$OLDN"
              fi
              touch "data/dl/.done-$Y"
            else
              echo "!! $Y failed (continue, keeping cached file)"
            fi
            sleep 45
          done
          ls -la data/dl | head -20
          wc -l data/dl/*.csv 2>/dev/null | tail -1 || true
      - name: Fail if no data
        run: |
          test -n "$(ls data/dl/*.csv 2>/dev/null)" || { echo "no data downloaded"; exit 1; }
      - name: Analyze (H3/H7/H8/H9)
        run: |
          pip install --quiet pandas numpy
          python verify/analyze.py
      - name: Commit results
        run: |
          git config user.name "gold-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add verify/results
          git commit -m "verify: 一括検証結果を更新 (H3/H7/H8/H9)" || echo "no changes"
          git push
